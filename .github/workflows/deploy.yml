name: Build and Deploy Blog

# 取代已停止服務的 Travis CI：
# 推送到 blog-source 分支時，自動 build 並把產出部署到 master 分支的 blog/ 目錄
on:
  push:
    branches: [blog-source]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: blog-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate site
        run: npx hexo generate

      - name: Deploy to master branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/deploy
          git clone --depth 1 --branch master \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            /tmp/deploy
          git -C /tmp/deploy config user.name "github-actions[bot]"
          git -C /tmp/deploy config user.email "github-actions[bot]@users.noreply.github.com"
          # 只更新 blog/ 目錄，保留 master 上其他檔案（test/、ads.txt 等）
          rsync -a --delete public/ /tmp/deploy/blog/
          cd /tmp/deploy
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Update blog (from ${{ github.sha }})"
            git push origin master
          fi
